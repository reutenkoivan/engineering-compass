# UI classification catalog

selection_policy:
  scope: "Screen-based user interfaces across product categories."
  matching: "Search all three pattern sections. Evaluate candidates by user goal, user needs, and task constraints."
  product_category: "Use product category only to find references. It must never filter, prioritize, or break ties between pattern candidates."
  compatibility: "Compatibility links are advisory. Check prerequisites, exclusions, and composition conditions for the actual task."
  no_match: "If the catalog does not cover the task, state the gap and propose a context-specific idea with a question to verify. For a material unknown, inspect available evidence before asking."
  source_lookup: "Use the local descriptions as starting evidence. Search available project files first for corroboration and examples. When useful, search public sources for the named work or the provided terms."
  source_evidence: "When sources were searched, state which specific feature each source supports and what remains open. Treat static mockups as evidence of composition. Verify claims about interaction through a relevant behavioral scenario."
  output_before_lo_fi:
    multiple_matches: "Give the recommended pattern or composition with IDs, the closest viable alternative, the condition that determines the choice, and a question for Lo-fi."
    single_match: "Give the sole viable pattern or composition with IDs, explain the constraint that determines the choice, and give a question for Lo-fi."
    no_match: "State the gap and offer a context-specific idea with a question for Ideate. Follow the catalog's no_match policy."
  identity: "Preserve IDs while meaning stays the same. Record successor IDs and split conditions when retiring an ID."

